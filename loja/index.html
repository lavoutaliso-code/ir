<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abrindo a loja…</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  O REDIRECIONADOR DA LOJA — o terceiro irmão, com OUTRO destino.

  `/ir/`       → WhatsApp do salão (combo presencial, R$ 279,90)
  `/ir/site/`  → o SITE DE AGENDAMENTO, na etapa da progressiva
  `/ir/loja/`  → a LOJA, na ABA DE PRODUTOS                      ← este aqui

  Ela pediu isso com a live de 07/11/2026 pronta pra subir: esta rodada NÃO
  vende o combo presencial, vende o SACHÊ DE PROGRESSIVA por R$ 59,90, que se
  compra na loja. O vídeo da live mostra a transformação com a tag de preço
  «BLACK FRIDAY · Sachê de progressiva · R$ 59,90», e o preço confere com o
  `nuvemshop:price` = 59.9 da página do sachê de 120 ml.

  ⚠️ POR QUE UM TERCEIRO ARQUIVO, E NÃO REAPROVEITAR O `/ir/site/`:
     o destino é FIXO no código de cada redirecionador (ver a nota abaixo).
     Trocar o destino do `/ir/site/` quebraria o funil do agendamento, que
     está medindo (`live-bf-agenda-06` = 88 cliques em 06/11).

  ── AS MESMAS DECISÕES DOS IRMÃOS, PRA NINGUÉM DESFAZER SEM SABER ─────────

  ⚠️ A ETIQUETA VEM EM `utm_campaign`, NUNCA em `sck`. É `utm_campaign` que o
     /api/visita grava e que o painel soma.

  ⚠️ O DESTINO É FIXO NO CÓDIGO, não vem por parâmetro — aceitar `?para=`
     criaria um redirecionador aberto. A URL só escolhe a ETIQUETA.

  ⚠️ A ETIQUETA VIAJA PRO DESTINO TAMBÉM, nas UTMs. É tudo que dá pra fazer
     aqui: a loja é NUVEMSHOP, não é página nossa — não existe onde instalar
     o `rastro.js`. Então a UTM chega lá, mas quem lê é o analytics da
     Nuvemshop, não o nosso funil.
     ⭐ CONSEQUÊNCIA MEDIDA, e ela foi avisada: «comprou na loja» é
        «NÃO MEDIMOS», não zero. O nosso rastro morre na porta da loja.

  ⚠️ DOIS PINGS, NÃO UM: `origem` = abriu esta página; `clique` = o pulo pra
     loja foi disparado. A diferença é quem abriu e não chegou.

  ⚠️ ROBÔ NÃO CONTA. A prévia de link do Instagram/WhatsApp busca a página
     pra montar o cartãozinho; isso não é cliente.

  ⚠️ O `lala.vid` É O MESMO DO `rastro.js` — a mesma cliente não vira duas.

  ⚠️ `sendBeacon` PRIMEIRO, teto de 600 ms pro plano B. Medir não pode fazer
     a cliente esperar.

  ⚠️ O BOTÃO VISÍVEL NÃO É ENFEITE: se o navegador de dentro do Instagram
     bloquear o salto, a tela não pode ficar branca.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0c; color: #fff;
    font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align: center;
  }
  .caixa { width: 100%; max-width: 420px; }
  .selo {
    display: inline-block; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: #f2c200; font-weight: 700; margin-bottom: 14px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; font-weight: 700; }
  .preco { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #fff; }
  .preco b { color: #f2c200; }
  p  { margin: 0 0 22px; color: #a9a9ad; font-size: 15px; }
  a.botao {
    display: block; background: #1BBFDB; color: #04232a; text-decoration: none;
    font-weight: 700; font-size: 18px; padding: 17px 20px; border-radius: 14px;
  }
  .rodinha {
    width: 26px; height: 26px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #1BBFDB;
    border-radius: 50%; animation: gira .8s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rodinha { animation: none; } }
</style>
</head>
<body>
  <div class="caixa">
    <div class="rodinha" aria-hidden="true"></div>
    <div class="selo">Black Friday</div>
    <h1>Abrindo a loja…</h1>
    <div class="preco">Sachê de progressiva · <b>R$ 59,90</b></div>
    <p>Se não abrir sozinho em 2 segundos, toque no botão.</p>
    <a class="botao" id="ir" href="#" rel="nofollow noopener">Quero o meu sachê!</a>
  </div>

<noscript>
  <!-- sem JS não há ping nenhum; melhor a cliente chegar do que a gente medir -->
  <meta http-equiv="refresh" content="0;url=https://www.lavoutaliso.com.br/produtos/">
</noscript>

<script>
(function () {
  'use strict';

  /* ⭐ O DESTINO. Fixo aqui, nunca por parâmetro — ver a nota do cabeçalho.
     É a ABA DE PRODUTOS da loja (Nuvemshop), não o agendamento e não a
     página de um produto só: a live mostra o sachê de R$ 59,90, e ela quis a
     vitrine aberta pra quem quiser levar mais de um item.
     ⚠️ Conferido em 07/11/2026: `GET /produtos/` responde 200 com UA de
        celular e NÃO engole as UTMs no redirecionamento. */
  var BASE = 'https://www.lavoutaliso.com.br/produtos/';

  var PING = 'https://lailasalon-consultoria.netlify.app/api/visita';
  var CHAVE_VID = 'lala.vid';
  var ESPERA = 600;   /* teto da espera do plano B, em ms */

  var botao = document.getElementById('ir');

  /* a etiqueta viaja numa URL: sem acento, sem espaço, minúscula, 24 */
  function limpa(s) {
    return String(s || '').toLowerCase()
      .replace(/[^a-z0-9_-]+/g, '').slice(0, 24);
  }

  var et = '';
  try {
    var p = new URLSearchParams(location.search);
    et = limpa(p.get('utm_campaign') || p.get('c') || '');
  } catch (e) { et = ''; }

  /* ⚠️ Sem etiqueta não se inventa uma: clique sem etiqueta não se sabe de
     qual criativo veio. Vai pra loja sem contar e sem carimbar etiqueta. */
  /* As UTMs vão junto: quem lê do outro lado é o analytics da Nuvemshop —
     o nosso funil não vê nada depois daqui. */
  var DESTINO = et
    ? BASE + '?utm_source=' + encodeURIComponent(et)
           + '&utm_medium=live&utm_campaign=' + encodeURIComponent(et)
    : BASE;

  if (botao) botao.href = DESTINO;

  var ROBO = /bot|crawl|spider|slurp|facebookexternalhit|facebookcatalog|whatsapp\/|preview|headlesschrome|embedly|quora link preview|pinterest|bingpreview|telegrambot|skypeuripreview|discordbot|vkshare|developers\.google\.com\/\+\/web\/snippet/i;
  var ehRobo = ROBO.test(navigator.userAgent || '');

  function visitante() {
    try {
      var v = localStorage.getItem(CHAVE_VID);
      if (v) return v;
      v = (Date.now().toString(36) + Math.random().toString(36).slice(2, 10))
        .replace(/[^a-z0-9]/g, '');
      localStorage.setItem(CHAVE_VID, v);
      return v;
    } catch (e) {
      return 'anon' + Math.random().toString(36).slice(2, 10);
    }
  }
  var vid = et && !ehRobo ? visitante() : '';

  /* devolve true se o beacon foi aceito (sobrevive à navegação) */
  function ping(evento) {
    if (!et || ehRobo) return true;
    var corpo = JSON.stringify({ et: et, evento: evento, vid: vid });
    try {
      if (navigator.sendBeacon
        && navigator.sendBeacon(PING, new Blob([corpo], { type: 'text/plain' }))) return true;
    } catch (e) { /* cai no fetch */ }
    try {
      fetch(PING, { method: 'POST', keepalive: true,
        headers: { 'content-type': 'text/plain' }, body: corpo }).catch(function () {});
    } catch (e) { /* medir não pode travar a ida pra loja */ }
    return false;
  }

  var pulou = false;
  function pula() {
    if (pulou) return;
    pulou = true;
    location.replace(DESTINO);
  }

  /* `origem` = abriu esta página (tocou no link da live)
     `clique` = saiu pra loja */
  var ok1 = ping('origem');
  var ok2 = ping('clique');

  if (ok1 && ok2) setTimeout(pula, 0);
  else setTimeout(pula, ESPERA);

  if (botao) botao.addEventListener('click', function () { pulou = true; });

  /* ⭐ A JANELA DA PROVA: é por aqui que o percurso de ponta a ponta confere
     etiqueta, destino e robô sem depender de print. Não guarda nada. */
  try {
    window.__ir = { et: et, vid: vid, destino: DESTINO, robo: ehRobo, pings: ['origem', 'clique'] };
  } catch (e) {}

  /* rede de segurança: se o `replace` não rolar, tenta de novo.
     ⚠️ MEDIDO EM 07/11/2026: nos irmãos esta linha testava
        `location.hostname.indexOf('github.io')`, e isso virou LETRA MORTA —
        o Pages ganhou o domínio próprio `lailasalon.com.br`, então
        `lavoutaliso-code.github.io/ir/...` responde 301 e a página roda
        hospedada em OUTRO hostname. A condição nunca mais foi verdadeira.
        Aqui a rede olha o que importa: continuamos nesta página? */
  setTimeout(function () {
    if (location.href.indexOf('/ir/loja/') >= 0) location.href = DESTINO;
  }, 2500);
})();
</script>
</body>
</html>
