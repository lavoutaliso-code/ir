<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abrindo o WhatsApp…</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  O REDIRECIONADOR COM CÓDIGO — é ele que faz o rastro NÃO morrer no wa.me.

  O irmão mais velho (`/ir/`) conta o clique e manda pro WhatsApp. Ele mede
  QUANTOS clicaram. Não mede QUEM — e era isso que faltava: depois do salto
  pro WhatsApp a pessoa é anônima, então «pagou o sinal e fechou» nunca
  conseguia voltar e encostar no clique que a trouxe.

  Esta versão carimba um CÓDIGO CURTO dentro da mensagem que a cliente manda.

  ── POR QUE DENTRO DA MENSAGEM ────────────────────────────────────────────

  O `wa.me` descarta tudo. Nenhum parâmetro de rastreio sobrevive ao salto:
  nem `utm_*`, nem fragmento, nem referrer. O ÚNICO campo que atravessa e
  chega aos olhos de um ser humano é o `text=` — a mensagem já escrita. Então
  o código viaja ali, visível, e a atendente o copia pra `obs` do agendamento.

  ── A DECISÃO QUE SEGURA TUDO: O CÓDIGO É DERIVADO, NÃO SORTEADO ──────────

  ⭐ `codigo = f(vid)`, função pura e congelada (FNV-1a de 32 bits → 4 letras).
     Não é sorteado, não é guardado em lugar nenhum pra depois ser procurado.

     POR QUE ISTO IMPORTA, e muito:
       · o mesmo visitante dá SEMPRE o mesmo código — F5, voltar, clicar de
         novo amanhã: é o mesmo código, então não existe cliente com dois;
       · o casador não precisa que o código tenha sido gravado. Ele recomputa
         `f(vid)` em cima dos visitantes que o rastro JÁ tem e acha de quem é.
         Ou seja: funciona PARA TRÁS, nos cliques que já estão contados, e não
         depende de nenhuma mudança no `/api/visita`;
       · não há escrita nova pra dar errado no meio de uma live no ar.

  ⚠️ SE ALGUÉM MEXER NO `codigo()`, TODO CÓDIGO JÁ DITO À CLIENTE VIRA PÓ.
     A função é contrato, não detalhe de implementação. Mudou a função, mudou
     o dono de cada código que já está escrito num `obs`. Não mexa: se
     precisar de outro formato, crie `codigo2()` e marque a data de virada.
     A cópia em Python vive em `casador/codigo.py` e as duas são conferidas
     pelo `casador/prova-codigo.sh` — rode-o depois de qualquer toque aqui.

  ── O ALFABETO ────────────────────────────────────────────────────────────

  32 símbolos, SEM `O` `0` `I` `1`. A cliente lê o código na tela e a
  atendente o digita: todo par ambíguo que sobrasse viraria agendamento
  carimbado com o código de outra pessoa — erro pior que não ter código,
  porque mente com cara de prova.

  ── OS DOIS CÓDIGOS RESERVADOS (têm 5 letras; os derivados têm 4) ─────────

  `SEMJS` — chegou sem JavaScript, pelo `<meta refresh>` do `<noscript>`.
            Não houve ping, não houve `vid`: este clique não é mensurável.
  `SEMET` — chegou sem etiqueta na URL (link escrito à mão, encurtador que
            comeu a query). Não se sabe de qual criativo veio.

  ⚠️ O COMPRIMENTO É QUE OS SEPARA: derivado tem 4, reservado tem 5. Por isso
     nenhum código derivado pode colidir com um reservado — não é sorte, é
     aritmética. Se um dia o derivado virar 5 letras, os reservados têm que
     mudar junto.

  ⚠️ CÓDIGO RESERVADO NÃO É ATRIBUIÇÃO. Quem aparece com `SEMJS`/`SEMET` conta
     como «não dá pra saber», NUNCA como «não agendou» e nunca como zero.

  ── O QUE FOI HERDADO DO IRMÃO (e continua valendo) ───────────────────────

  ⚠️ A ETIQUETA VEM EM `utm_campaign`, NUNCA em `sck`. É `utm_campaign` que o
     /api/visita grava. `sck` é a SAÍDA do rastro (o campo que a Kiwify
     devolve no webhook), não a entrada. Link com `?sck=` é ignorado aqui.
  ⚠️ O DESTINO É FIXO NO CÓDIGO. Aceitar `?para=` faria disto um
     redirecionador aberto, com o nosso endereço na frente do link de
     qualquer um. A URL escolhe só a ETIQUETA — o balde onde o clique cai.
  ⚠️ DOIS PINGS: `origem` = esta página abriu; `clique` = o salto pro
     WhatsApp saiu. A diferença é quem abriu e não foi.
  ⚠️ ROBÔ NÃO CONTA. A prévia do Instagram/WhatsApp/Facebook busca a página
     pra montar o cartãozinho; isso não é cliente. Em 22/10 o funil do quiz
     mostrou 218 aberturas contra 62 reais — 3,5× inflado. Robô redireciona
     mas NÃO pinga e NÃO ganha código.
  ⚠️ O `lala.vid` É O MESMO DO `rastro.js`. Mesma chave de localStorage, de
     propósito: quem já passou pela landing não vira duas pessoas.
  ⚠️ `sendBeacon` PRIMEIRO — ele sobrevive à página sendo trocada, e aqui ela
     é trocada sempre. `fetch keepalive` é o plano B, com teto de 600 ms:
     medir não pode fazer a cliente esperar.
  ⚠️ O BOTÃO VISÍVEL NÃO É ENFEITE. Se o navegador de dentro do Instagram
     bloquear o salto, a tela não fica branca.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0c; color: #fff;
    font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align: center;
  }
  .caixa { width: 100%; max-width: 420px; }
  .selo {
    display: inline-block; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: #f2c200; font-weight: 700; margin-bottom: 14px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; font-weight: 700; }
  p  { margin: 0 0 22px; color: #a9a9ad; font-size: 15px; }
  a.botao {
    display: block; background: #25D366; color: #06230f; text-decoration: none;
    font-weight: 700; font-size: 18px; padding: 17px 20px; border-radius: 14px;
  }
  .rodinha {
    width: 26px; height: 26px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #25D366;
    border-radius: 50%; animation: gira .8s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rodinha { animation: none; } }
</style>
</head>
<body>
  <div class="caixa">
    <div class="rodinha" aria-hidden="true"></div>
    <div class="selo">Black Friday</div>
    <h1>Abrindo o WhatsApp…</h1>
    <p>Se não abrir sozinho em 2 segundos, toque no botão.</p>
    <a class="botao" id="ir" href="#" rel="nofollow noopener">Chamar no WhatsApp</a>
  </div>

<noscript>
  <!-- ⚠️ Sem JS não existe `vid`, então não existe código derivado nem ping.
       O código reservado `SEMJS` é o jeito HONESTO de dizer isso: este clique
       chegou, e nós não temos como saber de quem é. Mensagem SEM código
       nenhum seria pior — viraria «a atendente esqueceu de anotar». -->
  <meta http-equiv="refresh" content="0;url=https://wa.me/5531993421299?text=Oi%21%20Quero%20o%20combo%20da%20Black%20Friday%20por%20R%24%20279%2C90%20%28c%C3%B3d.%20SEMJS%29">
</noscript>

<script>
(function () {
  'use strict';

  /* ⭐ O DESTINO. Fixo aqui, nunca por parâmetro — ver a nota do cabeçalho.
     31993421299 é o WhatsApp DO SALÃO (conferido com ela em 04/11/2026).
     ⚠️ 5531990029560 é o SAC, outro número: trocar um pelo outro manda a
        cliente da Black Friday pra fila errada. */
  var NUMERO = '5531993421299';
  var BASE = 'Oi! Quero o combo da Black Friday por R$ 279,90';

  var PING = 'https://lailasalon-consultoria.netlify.app/api/visita';
  var CHAVE_VID = 'lala.vid';
  var ESPERA = 600;   /* teto da espera do plano B, em ms */

  var botao = document.getElementById('ir');

  /* ═══════════════════════════════════════════════════════════════════════
     O CÓDIGO — FNV-1a 32 bits, 20 bits aproveitados, 4 símbolos de 32.

     ⚠️ FUNÇÃO CONGELADA. Ela é o contrato entre um código escrito num `obs`
        e o visitante que o gerou. Mexer aqui reescreve o passado.
     ⚠️ A cópia fiel em Python está em `casador/codigo.py`. As duas são
        conferidas sobre os visitantes REAIS pelo `casador/prova-codigo.sh`.
        Implementação que não foi conferida contra a irmã não vale: um `>>`
        com sinal no lugar de `>>>` daria códigos diferentes só às vezes.
     ⚠️ `Math.imul` não é luxo. `h * 0x01000193` passa de 2^53 e o JS começa
        a arredondar, silenciosamente — o código sairia diferente do Python
        em parte dos visitantes, e só nesses. `imul` faz a multiplicação de
        32 bits que o FNV-1a pede.
     ═══════════════════════════════════════════════════════════════════════ */
  var ALFABETO = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   /* 32, sem O 0 I 1 */
  function codigo(vid) {
    var h = 0x811c9dc5;                                 /* FNV offset basis */
    for (var i = 0; i < vid.length; i++) {
      h = h ^ vid.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;               /* FNV prime */
    }
    var s = '';
    for (var j = 0; j < 4; j++) { s = ALFABETO.charAt(h & 31) + s; h = h >>> 5; }
    return s;
  }

  /* a etiqueta viaja numa URL: sem acento, sem espaço, minúscula, 24 */
  function limpa(s) {
    return String(s || '').toLowerCase()
      .replace(/[^a-z0-9_-]+/g, '').slice(0, 24);
  }

  var et = '';
  try {
    var p = new URLSearchParams(location.search);
    /* `utm_campaign` é o campo oficial. `c` existe só pra link curto escrito
       à mão; o painel sempre entrega o `utm_campaign`. */
    et = limpa(p.get('utm_campaign') || p.get('c') || '');
  } catch (e) { et = ''; }

  var ROBO = /bot|crawl|spider|slurp|facebookexternalhit|facebookcatalog|whatsapp\/|preview|headlesschrome|embedly|quora link preview|pinterest|bingpreview|telegrambot|skypeuripreview|discordbot|vkshare|developers\.google\.com\/\+\/web\/snippet/i;
  var ehRobo = ROBO.test(navigator.userAgent || '');

  function visitante() {
    try {
      var v = localStorage.getItem(CHAVE_VID);
      if (v) return v;
      v = (Date.now().toString(36) + Math.random().toString(36).slice(2, 10))
        .replace(/[^a-z0-9]/g, '');
      localStorage.setItem(CHAVE_VID, v);
      return v;
    } catch (e) {
      /* navegador de dentro do app às vezes nega armazenamento: aí cada
         abertura é um visitante novo. Contar a mais é melhor que deixar a
         etapa vazia — e a tela diz VISITANTES, não pessoas. */
      return 'anon' + Math.random().toString(36).slice(2, 10);
    }
  }

  /* ⚠️ Sem etiqueta não se inventa uma: clique sem etiqueta é clique que não
     se sabe de qual criativo veio, e carimbar «live» por falta de dado faria
     ela comparar criativo com um balde comum. Vai pro WhatsApp sem contar —
     mas vai com `SEMET`, pra que a atendente ainda anote ALGO e esse caso
     apareça na conta como «não dá pra saber» em vez de desaparecer. */
  var vid = (et && !ehRobo) ? visitante() : '';
  var cod = vid ? codigo(vid) : (ehRobo ? '' : 'SEMET');

  /* ⚠️ Robô não leva código: a prévia do link não é cliente, e um código na
     mensagem da prévia seria um código que ninguém digitou. */
  var MENSAGEM = cod ? (BASE + ' (cód. ' + cod + ')') : BASE;
  var DESTINO = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(MENSAGEM);

  if (botao) botao.href = DESTINO;

  /* devolve true se o beacon foi aceito (sobrevive à navegação) */
  function ping(evento) {
    if (!et || ehRobo) return true;
    /* ⚠️ `cod` vai no corpo de propósito, mas HOJE o `/api/visita` ignora
       campo que ele não conhece — ele grava só `et`, `evento` e `vid`. Ou
       seja: isto NÃO é o que faz o casamento funcionar. Quem faz é o `vid`,
       que é gravado, mais o `codigo()` recomputado do outro lado. Mandar
       aqui é só pra que, no dia em que o ping aprender a guardar o código,
       nada precise mudar nesta página. Não conte com ele até ler no
       `/api/rastro-bruto`. */
    var corpo = JSON.stringify({ et: et, evento: evento, vid: vid, codigo: cod });
    try {
      if (navigator.sendBeacon
        && navigator.sendBeacon(PING, new Blob([corpo], { type: 'text/plain' }))) return true;
    } catch (e) { /* cai no fetch */ }
    try {
      fetch(PING, { method: 'POST', keepalive: true,
        headers: { 'content-type': 'text/plain' }, body: corpo }).catch(function () {});
    } catch (e) { /* medir não pode travar a ida pro WhatsApp */ }
    return false;
  }

  var pulou = false;
  function pula() {
    if (pulou) return;
    pulou = true;
    location.replace(DESTINO);
  }

  /* `origem` = abriu esta página (tocou no link da live)
     `clique` = saiu pro WhatsApp */
  var ok1 = ping('origem');
  var ok2 = ping('clique');

  /* beacon aceito nos dois: pode pular na hora, o navegador entrega sozinho.
     Senão, dá até 600 ms pro fetch sair antes de trocar de página. */
  if (ok1 && ok2) setTimeout(pula, 0);
  else setTimeout(pula, ESPERA);

  /* o botão é o plano B — e é o MESMO destino, sem ping dobrado (a chave do
     visitante é a mesma, gravar duas vezes não cria duas) */
  if (botao) botao.addEventListener('click', function () { pulou = true; });

  /* ⭐ A JANELA DE CONFERÊNCIA — é por aqui que a prova de ponta a ponta lê o
     que esta página decidiu, sem precisar interceptar rede. Não muda nada do
     comportamento: só deixa o que já aconteceu legível. */
  try {
    window.__ir = { et: et, vid: vid, cod: cod, msg: MENSAGEM, destino: DESTINO, robo: ehRobo };
  } catch (e) {}

  /* rede de segurança: se por algum motivo o replace não rolar, tenta de novo */
  setTimeout(function () { if (location.hostname.indexOf('github.io') >= 0) location.href = DESTINO; }, 2500);
})();
</script>
</body>
</html>
