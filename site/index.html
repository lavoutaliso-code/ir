<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abrindo o agendamento…</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  O REDIRECIONADOR DO SITE — irmão do `/ir/`, com OUTRO destino.

  `/ir/`       → WhatsApp do salão (combo presencial, R$ 279,90)
  `/ir/site/`  → o SITE DE AGENDAMENTO, na etapa da progressiva  ← este aqui

  Ela pediu isso com a live no ar (05/11/2026): o botão da live deixa de
  mandar pro WhatsApp e passa a abrir o AGENDAMENTO, já na progressiva, sem
  perder a medição. ⚠️ Site de agendamento, NÃO a loja de produto — a live
  vende o combo presencial de R$ 279,90, que se fecha agendando.

  ── AS MESMAS DECISÕES DO IRMÃO, PRA NINGUÉM DESFAZER SEM SABER ───────────

  ⚠️ A ETIQUETA VEM EM `utm_campaign`, NUNCA em `sck`. É `utm_campaign` que o
     /api/visita grava e que o painel soma.

  ⚠️ O DESTINO É FIXO NO CÓDIGO, não vem por parâmetro — aceitar `?para=`
     criaria um redirecionador aberto. A URL só escolhe a ETIQUETA.

  ⚠️ A ETIQUETA VIAJA PRO DESTINO TAMBÉM, em `origem` (o campo que a própria
     agenda já lê, como no `?origem=instagram-bio` do link da bio) e nas UTMs.
     O rastro não pode morrer na porta do agendamento.

  ⚠️ DOIS PINGS, NÃO UM: `origem` = abriu esta página; `clique` = o pulo pro
     site foi disparado. A diferença é quem abriu e não chegou.

  ⚠️ ROBÔ NÃO CONTA. A prévia de link do Instagram/WhatsApp busca a página
     pra montar o cartãozinho; isso não é cliente.

  ⚠️ O `lala.vid` É O MESMO DO `rastro.js` — a mesma cliente não vira duas.

  ⚠️ `sendBeacon` PRIMEIRO, teto de 600 ms pro plano B. Medir não pode fazer
     a cliente esperar.

  ⚠️ O BOTÃO VISÍVEL NÃO É ENFEITE: se o navegador de dentro do Instagram
     bloquear o salto, a tela não pode ficar branca.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0c; color: #fff;
    font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align: center;
  }
  .caixa { width: 100%; max-width: 420px; }
  .selo {
    display: inline-block; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: #f2c200; font-weight: 700; margin-bottom: 14px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; font-weight: 700; }
  p  { margin: 0 0 22px; color: #a9a9ad; font-size: 15px; }
  a.botao {
    display: block; background: #1BBFDB; color: #04232a; text-decoration: none;
    font-weight: 700; font-size: 18px; padding: 17px 20px; border-radius: 14px;
  }
  .rodinha {
    width: 26px; height: 26px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #1BBFDB;
    border-radius: 50%; animation: gira .8s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rodinha { animation: none; } }
</style>
</head>
<body>
  <div class="caixa">
    <div class="rodinha" aria-hidden="true"></div>
    <div class="selo">Black Friday</div>
    <h1>Abrindo o agendamento…</h1>
    <p>Se não abrir sozinho em 2 segundos, toque no botão.</p>
    <a class="botao" id="ir" href="#" rel="nofollow noopener">Agende em 1 minuto!</a>
  </div>

<noscript>
  <!-- sem JS não há ping nenhum; melhor a cliente chegar do que a gente medir -->
  <meta http-equiv="refresh" content="0;url=https://agendeaquilavoutaliso.netlify.app/">
</noscript>

<script>
(function () {
  'use strict';

  /* ⭐ O DESTINO. Fixo aqui, nunca por parâmetro — ver a nota do cabeçalho.
     É o SITE DE AGENDAMENTO do salão, não a loja de produto: a live vende o
     combo presencial (progressiva + pré-química + diagnóstico + kit) por
     R$ 279,90, que se fecha agendando, não comprando frasco.
     ⚠️ Corrigido em 05/11/2026: por 20 min este link apontou pro Kit de
        Progressiva da loja — destino errado, ela viu e mandou trocar. */
  /* ⚠️ 05/11/2026, 2ª troca: saiu da Netlify (conta sem pagamento, e o site
     nem estava na conta logada aqui) e foi pro GitHub Pages, com a tela nova
     aprovada: botão «Agendar» em cada linha + faixa vermelha da Black Friday.
     Mesmo app, mesmo backend (Railway), medição de visita conferida igual. */
  var BASE = 'https://lavoutaliso-code.github.io/agende/';

  var PING = 'https://lailasalon-consultoria.netlify.app/api/visita';
  var CHAVE_VID = 'lala.vid';
  var ESPERA = 600;   /* teto da espera do plano B, em ms */

  var botao = document.getElementById('ir');

  /* a etiqueta viaja numa URL: sem acento, sem espaço, minúscula, 24 */
  function limpa(s) {
    return String(s || '').toLowerCase()
      .replace(/[^a-z0-9_-]+/g, '').slice(0, 24);
  }

  var et = '';
  try {
    var p = new URLSearchParams(location.search);
    et = limpa(p.get('utm_campaign') || p.get('c') || '');
  } catch (e) { et = ''; }

  /* ⚠️ Sem etiqueta não se inventa uma: clique sem etiqueta não se sabe de
     qual criativo veio. Vai pro agendamento sem contar e sem carimbar etiqueta. */
  /* `origem` é o campo que a PRÓPRIA agenda lê (ela já usa `instagram-bio`
     no link da bio). As UTMs vão junto pro resto do rastro. */
  var DESTINO = et
    ? BASE + '?origem=' + encodeURIComponent(et)
           + '&utm_source=' + encodeURIComponent(et)
           + '&utm_medium=live&utm_campaign=' + encodeURIComponent(et)
    : BASE;

  if (botao) botao.href = DESTINO;

  var ROBO = /bot|crawl|spider|slurp|facebookexternalhit|facebookcatalog|whatsapp\/|preview|headlesschrome|embedly|quora link preview|pinterest|bingpreview|telegrambot|skypeuripreview|discordbot|vkshare|developers\.google\.com\/\+\/web\/snippet/i;
  var ehRobo = ROBO.test(navigator.userAgent || '');

  function visitante() {
    try {
      var v = localStorage.getItem(CHAVE_VID);
      if (v) return v;
      v = (Date.now().toString(36) + Math.random().toString(36).slice(2, 10))
        .replace(/[^a-z0-9]/g, '');
      localStorage.setItem(CHAVE_VID, v);
      return v;
    } catch (e) {
      return 'anon' + Math.random().toString(36).slice(2, 10);
    }
  }
  var vid = et && !ehRobo ? visitante() : '';

  /* devolve true se o beacon foi aceito (sobrevive à navegação) */
  function ping(evento) {
    if (!et || ehRobo) return true;
    var corpo = JSON.stringify({ et: et, evento: evento, vid: vid });
    try {
      if (navigator.sendBeacon
        && navigator.sendBeacon(PING, new Blob([corpo], { type: 'text/plain' }))) return true;
    } catch (e) { /* cai no fetch */ }
    try {
      fetch(PING, { method: 'POST', keepalive: true,
        headers: { 'content-type': 'text/plain' }, body: corpo }).catch(function () {});
    } catch (e) { /* medir não pode travar a ida pro agendamento */ }
    return false;
  }

  var pulou = false;
  function pula() {
    if (pulou) return;
    pulou = true;
    location.replace(DESTINO);
  }

  /* `origem` = abriu esta página (tocou no link da live)
     `clique` = saiu pro agendamento */
  var ok1 = ping('origem');
  var ok2 = ping('clique');

  if (ok1 && ok2) setTimeout(pula, 0);
  else setTimeout(pula, ESPERA);

  if (botao) botao.addEventListener('click', function () { pulou = true; });

  /* rede de segurança: se o replace não rolar, tenta de novo */
  setTimeout(function () { if (location.hostname.indexOf('github.io') >= 0) location.href = DESTINO; }, 2500);
})();
</script>
</body>
</html>
